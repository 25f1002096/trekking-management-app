<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
    <link rel="stylesheet" href="../static/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="outer-box" s>

        <div class="inner-box" >
                    <a href="home.html">back</a>
                    <h2 style="text-align: center;">Login</h2>
                    <div style="padding: 30px;">
                        <form action='/directingToDashboard/' method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="text" class="form-control" id="email" name="email" placeholder="xyz@.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="password">
                            </div>
                            <div class="col-10" style="display: flex; justify-content: center; margin-top: 50px;">
                            <button type="submit" class="btn btn-outline-primary">submit</button>
                            </div>
                            <p>don't have an account <a href="home.html">Signin</a></p>
                        </form>
                    </div>
         
        </div>
    </div>
</body>
</html>

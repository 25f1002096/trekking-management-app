<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>staff history</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div style="padding: 25ox;">
        <h5><a href="/adminDashboard/">back</a></h5>
        <div style="margin:25px;">
            <h4>Assigned Treks</h4>
            <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Trek name</th>
      <th scope="col">Id</th>
      <th scope="col">status</th>
    </tr>
  </thead>
  <tbody>
    {% if assigned_treks %}
     {for row in assigned_treks %} 
        <tr>
        <th scope="row">1</th>
        <td>{{row.Trek_name}}</td>
        <td>{{row.trek_id}}</td>
        <td>{{row.status}}</td>
        </tr>
     {% endfor %}
    {% endif %}
   
   
  </tbody>
</table>

        </div>
    </div>
</body>
</html>

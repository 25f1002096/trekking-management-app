<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid" style="background-color: antiquewhite;  height: 45px;">
        <nav class="navbar ">
                <div class="container-fluid">
                    <em><h3>Trekking Management App</h3></em>
                    
                </div>
        </nav>
    </div>
    <div class="alert alert-success" role="alert" style="text-align:center; box-shadow: 0px 4px 8px; height:55px">
        <p style="font-size: 25px;"><i>congratulation! start you trkking {{user}}</i></p>
         
    </div>
    <div>
        {% if book %}
        <p>Trek Name: {{book.trek.Trek_name}}</p>
        <p>book Status: {{book.status}}</p>
        {% endif %}
        {% if book.trek.status !='complete' %}
            <form action="/user/booking/cancle/{{book.Book_id}}/" method="POST">
                {% if book.status=='Cancelled' %}
                <input name="cancle" type="text" value="{{book.status}}" disabled>
            
                {% else %}
            
                <input name="cancle" type="text" value="{{book.status}}" readonly>
                <button type="submit">cancle</button>
            </form>
                {% endif %}
        {% endif %}

    </div>
</body>
</html>
